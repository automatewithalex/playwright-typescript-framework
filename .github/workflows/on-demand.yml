name: On demand

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional tag expression, e.g. @smoke, @api, "@regression|@a11y". Leave empty to run every test.
        type: string
        required: false
      app:
        description: Application
        type: choice
        options: [all, awa, testblocks]
        default: all
      browser:
        description: Browser
        type: choice
        options: [all, chromium, firefox, webkit, mobile]
        default: chromium
      shards:
        description: Parallel shards
        type: choice
        options: ['1', '2', '4']
        default: '1'
      repeat:
        description: Repeat each test N times to hunt flaky tests
        type: string
        default: '1'
      update-snapshots:
        description: Regenerate visual baselines (ignores the other inputs)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_run-tests.yml
    with:
      grep: ${{ inputs.tag }}
      app: ${{ inputs.app }}
      browser: ${{ inputs.browser }}
      shards: ${{ fromJSON(inputs.shards) }}
      repeat: ${{ fromJSON(inputs.repeat) }}
      update-snapshots: ${{ inputs.update-snapshots }}
    secrets: inherit
